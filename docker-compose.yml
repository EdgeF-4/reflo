services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: reflo-postgres:16.14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reflo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "reflo"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: reflo-api:gate9-20260812
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-before-remote-use}
      # Runtime role is unprivileged and subject to row-level security.
      DATABASE_URL: postgres://reflo_app:reflo_app_pw@db:5432/reflo
      # Superuser role, used only for migrations and seeding.
      ADMIN_DATABASE_URL: postgres://postgres:postgres@db:5432/reflo
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
      AI_CONFIG_PATH: /app/config.json
    ports:
      - "127.0.0.1:${REFLO_API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "/usr/bin/node", "-e", "fetch('http://localhost:4000/health').then(async r=>{let j;try{j=await r.json()}catch(e){throw new Error('invalid JSON: '+e.message)}if(!r.ok||j.status!=='ok'){throw new Error('HTTP '+r.status+' reported '+String(j.status))}}).catch(e=>{console.error('Reflo API health check failed: '+e.message+'. Next: inspect the API and database logs, correct the cause, then retry.');process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: reflo-web:gate9-20260812
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser reaches the API on the host-published port.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REFLO_WEB_PORT:-3000}:3000"

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        # A small explicit demo subnet avoids failure when Docker's automatic
        # address pools are already allocated. Override if this range collides.
        - subnet: ${REFLO_SUBNET:-10.253.240.0/24}
